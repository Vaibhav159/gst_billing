name: Release

# Tag-based releases: images are built ONLY when a version tag is pushed
# (git tag v2.0.0 && git push origin v2.0.0, or a GitHub Release). Merging
# to main runs Tests but publishes nothing — you choose when prod changes.
# On the server, Watchtower (see docker-compose.yml) sees the new :latest
# within a minute and redeploys automatically; the versioned tag stays on
# Docker Hub for rollback.
#
# workflow_dispatch is the manual escape hatch: it builds whatever ref you
# run it from and tags the images :latest + :<ref-name>.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release mid-push — a half-published pair of images
  # (new backend, old nginx) is worse than a slightly slower queue.
  cancel-in-progress: false

jobs:
  test:
    # Release gate. This used to run on SQLite only, so a Postgres-only failure
    # first executed in production — inside the server's unattended `migrate`.
    # Now the same Postgres major as prod, plus the migrations check, plus the
    # frontend typecheck (vite build does not typecheck; tsc is the only thing
    # that does, and it was never run on a tag).
    name: Release gate (Postgres tests + migrations + typecheck)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: circleci
          POSTGRES_PASSWORD: circleci
          POSTGRES_DB: circle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U circleci"
          --health-interval 5s
    env:
      DJANGO_SETTINGS_MODULE: gst_billing.ci_settings
      DATABASE_URL: postgresql://circleci:circleci@localhost/circle_test
      DJANGO_SECRET_KEY: ci-test-key-not-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: |
          uv venv
          uv pip install . pytest pytest-django 'setuptools<81'
      - name: Models and migrations agree
        run: |
          source .venv/bin/activate
          python manage.py makemigrations --check --dry-run
      - name: Migrate against Postgres
        run: |
          source .venv/bin/activate
          python manage.py migrate --noinput
      - name: Backend tests on Postgres
        run: |
          source .venv/bin/activate
          pytest billing/ -x --tb=short
      - name: Frontend typecheck
        working-directory: sweet-rebuild-suite-main
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Django Backend
            image: gst-billing
            file: ./Dockerfile
          - name: Nginx
            image: gst-billing-nginx
            file: ./nginx/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          # :latest is what the server tracks; :vX.Y.Z (the git tag name) is
          # the immutable handle you roll back to.
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:buildcache,mode=max
