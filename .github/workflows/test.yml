name: Tests

# Runs the backend unit tests + Playwright E2E tests on every push and PR.
# Uses an in-runner Postgres + Django + Vite stack so no external DB credentials
# leak into CI.

on:
  push:
    branches:
      - main
      - polish
      - new_ui
  pull_request:
    branches: [main]

jobs:
  nginx-config:
    # A broken conf would brick the nginx container on Watchtower's next
    # auto-deploy — validate it the way nginx itself will read it.
    name: nginx config validates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t against the shipped conf.d
        run: |
          docker run --rm -v "$PWD/nginx/conf.d":/etc/nginx/conf.d:ro nginx:alpine \
            sh -c "mkdir -p /var/www/static /var/www/media /usr/share/nginx/html && nginx -t"

      # nginx -t only proves the syntax parses; it says nothing about a
      # directive being absent. The 1MB built-in default silently broke photo
      # capture on prod for exactly that reason — nothing was misconfigured,
      # the ceiling was simply never raised. Assert the app's 20MB promise is
      # actually reachable through nginx. E2E cannot cover this: it runs
      # Vite -> gunicorn with no nginx in the path.
      - name: upload ceiling clears the app's 20MB cap
        run: |
          python3 - <<'EOF'
          import re, sys
          conf = open("nginx/conf.d/app.conf").read()
          # strip comments so a commented-out directive cannot satisfy this
          live = "\n".join(l.split("#")[0] for l in conf.splitlines())
          m = re.search(r"client_max_body_size\s+(\d+)([kKmMgG]?)\s*;", live)
          if not m:
              sys.exit("FAIL: no client_max_body_size — nginx defaults to 1m and "
                       "will 413 every phone photo before Django sees it.")
          mult = {"": 1, "k": 1024, "m": 1024**2, "g": 1024**3}[m.group(2).lower()]
          got = int(m.group(1)) * mult
          app_cap = 20 * 1024 * 1024  # billing/api/inward_bills.py _MAX_SIZE
          if got < app_cap:
              sys.exit(f"FAIL: `{m.group(0).strip()}` is below the app's own 20MB cap.")
          print(f"OK: {m.group(0).strip()} >= app cap 20MB")
          EOF

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-24.04
    # No Postgres service — gst_billing.test_settings forces SQLite (:memory:)
    # for fast unit tests. The DB_* env vars and Postgres provisioning would be
    # ignored. The frontend job below still uses Postgres for E2E migrate/seed.
    env:
      DJANGO_SETTINGS_MODULE: gst_billing.test_settings
      DJANGO_SECRET_KEY: ci-test-key-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: |
          uv venv
          # Install from pyproject.toml so CI tracks declared deps (incl. google-genai etc.)
          # setuptools needed for pkg_resources used by some transitive deps
          # (e.g. django-simple-history). Pin <81 because setuptools 81+ removed
          # the vendored `pkg_resources` module.
          uv pip install . pytest pytest-django gunicorn 'setuptools<81'
      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest billing/ -x --tb=short

  frontend:
    name: Frontend (vitest + Playwright E2E)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gst_test
          POSTGRES_PASSWORD: gst_test_local
          POSTGRES_DB: gst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gst_test"
          --health-interval 5s
    env:
      DJANGO_SETTINGS_MODULE: gst_billing.production_settings
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: gst_test
      DB_USER: gst_test
      DB_PASSWORD: gst_test_local
      DJANGO_SECRET_KEY: ci-test-key-not-secret
      DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend deps
        run: |
          pip install uv
          uv venv
          # Install from pyproject.toml so CI tracks declared deps automatically.
          # `setuptools` is needed by some transitive deps that still import
          # `pkg_resources` at runtime (uv's venv doesn't include it by default).
          # Pin <81 because setuptools 81+ removed the vendored `pkg_resources`.
          uv pip install . gunicorn 'setuptools<81'
      - name: Migrate + seed
        run: |
          source .venv/bin/activate
          mkdir -p logs
          python manage.py migrate --noinput
          python manage.py shell -c "
          from django.contrib.auth.models import User
          from billing.models import Business, Customer, Product
          u, _ = User.objects.get_or_create(username='testuser', defaults={'is_superuser': True, 'is_staff': True})
          u.set_password('testpass2026'); u.save()
          b, _ = Business.objects.get_or_create(name='TEST JEWELLERS', defaults={'gst_number':'08TEST1234A1ZA','address':'Test','state_name':'RAJASTHAN','pan_number':'TEST1234A','mobile_number':'9999999999'})
          c, _ = Customer.objects.get_or_create(name='TEST CUSTOMER', defaults={'state_name':'RAJASTHAN','mobile_number':'8888888888'})
          c.businesses.add(b)
          Product.objects.get_or_create(name='Gold Ornaments', defaults={'hsn_code':'711319','gst_tax_rate':0.03})
          "
      - name: Start backend
        run: |
          source .venv/bin/activate
          gunicorn gst_billing.wsgi:application --bind 0.0.0.0:8000 --workers 2 --daemon
          sleep 3
          curl -s -o /dev/null -w "Django: %{http_code}\n" http://localhost:8000/api/profile/ || true
      - name: Install frontend deps
        working-directory: sweet-rebuild-suite-main
        run: npm ci
      - name: Typecheck frontend
        working-directory: sweet-rebuild-suite-main
        # vite build does not typecheck, so nothing was looking at these. A
        # number-vs-string id comparison that tsc flags plainly is what silently
        # booked interstate invoices as CGST+SGST for months.
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Run frontend unit tests
        working-directory: sweet-rebuild-suite-main
        run: npm run test -- --run
      - name: Start Vite dev server (with /api proxy to Django)
        working-directory: sweet-rebuild-suite-main
        run: |
          # Vite dev server proxies /api → http://127.0.0.1:8000 (see vite.config.ts).
          # Production build + `npx serve` would NOT proxy, so login/API calls would
          # land back on the frontend host.
          nohup npx vite --port 8080 --host 0.0.0.0 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/ >/dev/null 2>&1; then
              echo "Vite ready"; break
            fi
            sleep 1
          done
          curl -s -o /dev/null -w "Frontend: %{http_code}\n" http://localhost:8080/
          curl -s -o /dev/null -w "API via proxy: %{http_code}\n" http://localhost:8080/api/profile/
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e-tests/package-lock.json') }}
      - name: Install Playwright
        working-directory: e2e-tests
        # timeout-minutes: a CDN stall here once sat "in_progress" for 40+
        # minutes (runs 32216340885 / 32217543370, 19 Aug 2026) with the
        # default 6h job timeout as the only backstop. The cache makes the
        # download a no-op on repeat runs; the timeout makes a stall a fast,
        # retryable failure instead of a hung job.
        timeout-minutes: 8
        run: |
          # e2e-tests/package.json + lockfile are checked in, so npm ci
          # is reproducible and cache-friendly (vs the previous
          # `npm init -y && npm install` which had no lockfile).
          npm ci
          # No --with-deps: it runs apt against the Azure Ubuntu mirrors, which
          # wedged this job twice (once for 40+ minutes, once eating the whole
          # 8-minute timeout on 19 Aug 2026). The ubuntu-24.04 runner image
          # already ships Chrome and therefore every shared library headless
          # Chromium needs — apt here was all risk, no benefit.
          npx playwright install chromium
      - name: Run E2E tests
        working-directory: e2e-tests
        timeout-minutes: 15
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test --reporter=list
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/
          retention-days: 7
