[project]
name = "gst-billing"
version = "0.1.0"
description = "GST Billing Application"
readme = "README.md"
# <3.14 until pydantic-core (via google-genai) ships cp314 wheels.
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
dependencies = [
    # 5.2 LTS — the 4.2 line left extended support in April 2026, so the old
    # ==4.2.2 pin (June 2023) was an EOL branch on a public-internet app.
    "django>=5.2,<6.2",
    "django-cors-headers>=4.7",
    # crispy 2.x split the bootstrap4 template pack into its own package. Only
    # the legacy (unrouted) HTMX templates render through it, but the app must
    # still import cleanly under Django 5.
    "django-crispy-forms>=2.4",
    "crispy-bootstrap4>=2024.10",
    "django-htmx>=1.21",
    "django-simple-history>=3.10",
    "django-sql-explorer>=5.3",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "freezegun>=1.5.1",
    "ipython>=8.14.0",
    "num2words>=0.5.14",
    "openpyxl>=3.1",
    "pre-commit>=2.19.0",
    # psycopg 3 — Django 5.x's preferred driver (psycopg2-binary has no clean
    # build on newer Pythons here). ENGINE stays django.db.backends.postgresql,
    # which auto-detects the installed driver.
    "psycopg[binary]>=3.2",
    "requests>=2.28.1",
    "pandas>=2.0.2",
    "pillow>=9.5.0",
    # iPhone photos default to HEIC; pillow-heif registers a Pillow opener
    # so AIInvoiceProcessor / GSTR-2A flows can read .heic uploads. Always
    # re-encoded to JPEG before going to Gemini.
    "pillow-heif>=0.21.0",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    "setuptools>=61.0",
    "xlsxwriter>=3.2",
    "django-cacheops>=7.2",
    "python-dotenv>=1.1.0",
    "pip-system-certs>=4.0",
    "google-genai>=1.33.0",
    # Error tracking — initialized only when SENTRY_DSN is set (production).
    # Until this, prod exceptions were invisible unless someone tailed the
    # container logs.
    "sentry-sdk[django]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "coverage",
    "black",
    "isort",
    "flake8",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Use setuptools package discovery scoped to our two top-level Python
# packages. The repo has several non-Python top-level dirs (frontend,
# nginx, sweet-rebuild-suite-main, etc.) so flat auto-detection fails;
# `include` keeps it scoped while still picking up subpackages like
# billing.api, billing.management, billing.management.commands, etc.
[tool.setuptools.packages.find]
include = ["billing*", "gst_billing*"]
exclude = ["billing.tests*", "node_modules*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gst_billing.test_settings"
python_files = "test_*.py"
testpaths = ["billing/tests"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
